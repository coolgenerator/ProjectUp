version: '3.8'

services:
  # Frontend React Application
  frontend:
    build: ./frontend
    container_name: projectup-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - projectup-network

  # Backend Go/Gin API
  backend:
    build: ./backend
    container_name: projectup-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=projectup
      - DB_PASSWORD=projectup_password
      - DB_NAME=projectup
      - AI_AGENT_URL=http://ai-agent:8000
      - JWT_SECRET=your_jwt_secret_here
    depends_on:
      - postgres
      - ai-agent
    networks:
      - projectup-network

  # AI Agent FastAPI Service
  ai-agent:
    build: ./ai-service
    container_name: projectup-ai-agent
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080  # Internal Docker network port
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VERTEX_AI_PROJECT=${VERTEX_AI_PROJECT}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION}
    depends_on:
      - searxng
    networks:
      - projectup-network

  # SearXNG Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: projectup-searxng
    ports:
      - "8888:8080"  # Expose on 8888, internal is 8080
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-ultrasecretkey}
    restart: unless-stopped
    networks:
      - projectup-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: projectup-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=projectup
      - POSTGRES_PASSWORD=projectup_password
      - POSTGRES_DB=projectup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projectup-network

  # Redis Cache (optional, for session management)
  redis:
    image: redis:7-alpine
    container_name: projectup-redis
    ports:
      - "6379:6379"
    networks:
      - projectup-network

networks:
  projectup-network:
    driver: bridge

volumes:
  postgres_data:
  searxng_data: