# Workflow Registry - Central definition of all AI workflows
# Workflows are grouped by category and can be used across multiple contexts
# Version: 1.0

version: "1.0"

# ============================================================================
# CATEGORIES
# ============================================================================
categories:
  - id: planning
    name: Planning
    description: Strategic planning and roadmap workflows
    icon: "clipboard-list"
    order: 1

  - id: breakdown
    name: Breakdown
    description: Decompose ideas and tasks into smaller pieces
    icon: "git-branch"
    order: 2

  - id: learning
    name: Learning
    description: Educational resources and learning paths
    icon: "book-open"
    order: 3

  - id: analysis
    name: Analysis
    description: Feasibility, effort, and dependency analysis
    icon: "chart-bar"
    order: 4

  - id: integration
    name: Integrations
    description: Connect with external services and APIs
    icon: "plug"
    order: 5

# ============================================================================
# WORKFLOWS
# ============================================================================
workflows:
  # --------------------------------------------------------------------------
  # PLANNING WORKFLOWS
  # --------------------------------------------------------------------------
  expand_idea:
    name: "Expand Idea"
    description: "Break down an idea into sub-components and explore dimensions"
    category: planning
    icon: "lightbulb"
    contexts:
      - ideatree
    handler: "planning.expand_idea_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        title:
          type: string
          description: "Title of the idea to expand"
        description:
          type: string
          description: "Description of the idea"
      optional:
        depth:
          type: number
          default: 2
          description: "How deep to expand (1-3)"
        focus_areas:
          type: array
          items: string
          description: "Specific areas to focus expansion on"
    output_schema:
      suggestions:
        type: array
        items:
          type: object
          properties:
            title: string
            description: string
            type: string
      child_ideas:
        type: array
        items:
          $ref: "#/definitions/IdeaNode"

  generate_plan:
    name: "Generate Plan"
    description: "Create comprehensive project plan with milestones and tasks"
    category: planning
    icon: "clipboard-check"
    contexts:
      - ideatree
      - taskboard
    handler: "planning.generate_plan_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        title:
          type: string
        description:
          type: string
      optional:
        include_milestones:
          type: boolean
          default: true
        include_tasks:
          type: boolean
          default: true
        timeline_weeks:
          type: number
          description: "Estimated project duration in weeks"

  suggest_milestones:
    name: "Suggest Milestones"
    description: "Create project checkpoints and deliverables"
    category: planning
    icon: "flag"
    contexts:
      - ideatree
    handler: "planning.suggest_milestones_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        title:
          type: string
        description:
          type: string
      optional:
        num_milestones:
          type: number
          default: 5
        project_duration_weeks:
          type: number

  # --------------------------------------------------------------------------
  # BREAKDOWN WORKFLOWS (Shared handlers)
  # --------------------------------------------------------------------------
  generate_tasks:
    name: "Generate Tasks"
    description: "Create actionable tasks from idea or plan"
    category: breakdown
    icon: "check-square"
    contexts:
      - ideatree
      - taskboard
    handler: "breakdown.generate_tasks_handler"
    cross_reference: task_breakdown
    enabled: true
    input_schema:
      required:
        source_type:
          type: string
          enum: [idea, plan, task]
        source_content:
          type: string
      optional:
        source_id:
          type: string
        num_tasks:
          type: number
          default: 5
        include_estimates:
          type: boolean
          default: true
        include_dependencies:
          type: boolean
          default: false

  task_breakdown:
    name: "Break Down Task"
    description: "Split task into subtasks with estimates"
    category: breakdown
    icon: "scissors"
    contexts:
      - taskboard
      - ideatree
    handler: "breakdown.generate_tasks_handler"
    cross_reference: generate_tasks
    enabled: true
    input_schema:
      required:
        task_title:
          type: string
        task_description:
          type: string
      optional:
        task_id:
          type: string
        subtask_count:
          type: number
          default: 5
        detail_level:
          type: string
          enum: [brief, detailed]
          default: detailed

  # --------------------------------------------------------------------------
  # LEARNING WORKFLOWS
  # --------------------------------------------------------------------------
  find_resources:
    name: "Find Resources"
    description: "Discover learning materials, courses, and documentation"
    category: learning
    icon: "search"
    contexts:
      - ideatree
      - taskboard
    handler: "learning.find_resources_handler"
    cross_reference: task_guidance
    enabled: true
    input_schema:
      required:
        topic:
          type: string
      optional:
        skill_level:
          type: string
          enum: [beginner, intermediate, advanced]
          default: intermediate
        resource_types:
          type: array
          items:
            type: string
            enum: [video, article, course, book, docs, tutorial]
        max_results:
          type: number
          default: 10

  task_guidance:
    name: "How Do I Do This?"
    description: "Get step-by-step guidance for completing a task"
    category: learning
    icon: "compass"
    contexts:
      - taskboard
      - ideatree
    handler: "learning.task_guidance_handler"
    cross_reference: find_resources
    enabled: true
    input_schema:
      required:
        task_title:
          type: string
      optional:
        task_description:
          type: string
        context:
          type: string
          description: "Additional context about the task"

  generate_learning_path:
    name: "Generate Learning Path"
    description: "Create personalized learning journey with modules"
    category: learning
    icon: "graduation-cap"
    contexts:
      - ideatree
    handler: "learning.generate_learning_path_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        topic:
          type: string
      optional:
        current_skill_level:
          type: string
          enum: [beginner, intermediate, advanced]
        target_skill_level:
          type: string
          enum: [intermediate, advanced, expert]
        time_available_hours:
          type: number
          description: "Hours available per week for learning"

  # --------------------------------------------------------------------------
  # ANALYSIS WORKFLOWS
  # --------------------------------------------------------------------------
  analyze_feasibility:
    name: "Analyze Feasibility"
    description: "Assess technical viability and identify challenges"
    category: analysis
    icon: "clipboard-check"
    contexts:
      - ideatree
    handler: "analysis.feasibility_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        title:
          type: string
        description:
          type: string
      optional:
        constraints:
          type: array
          items: string
          description: "Known constraints (budget, time, tech stack)"
        team_size:
          type: number

  estimate_effort:
    name: "Estimate Effort"
    description: "Get time and complexity estimates"
    category: analysis
    icon: "clock"
    contexts:
      - taskboard
    handler: "analysis.effort_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        task_title:
          type: string
      optional:
        task_description:
          type: string
        complexity_factors:
          type: array
          items: string

  find_dependencies:
    name: "Find Dependencies"
    description: "Identify task dependencies and blockers"
    category: analysis
    icon: "git-merge"
    contexts:
      - taskboard
    handler: "analysis.dependencies_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        task_id:
          type: string
        task_title:
          type: string
      optional:
        existing_tasks:
          type: array
          items:
            type: object
            properties:
              id: string
              title: string
              status: string

  analyze_plan:
    name: "Analyze Plan"
    description: "Review and score existing plan"
    category: analysis
    icon: "chart-line"
    contexts:
      - ideatree
    handler: "analysis.analyze_plan_handler"
    cross_reference: null
    enabled: true
    input_schema:
      required:
        plan_content:
          type: string
      optional:
        evaluation_criteria:
          type: array
          items: string
          default: [completeness, feasibility, clarity, risk_assessment]

  # --------------------------------------------------------------------------
  # INTEGRATION WORKFLOWS
  # --------------------------------------------------------------------------
  sync_to_external:
    name: "Sync to External Service"
    description: "Push tasks/ideas to external project management tools"
    category: integration
    icon: "upload-cloud"
    contexts:
      - ideatree
      - taskboard
    handler: "integration.sync_to_external_handler"
    cross_reference: null
    enabled: true
    requires_integration: true
    input_schema:
      required:
        integration_id:
          type: string
          description: "ID of the configured integration"
        items:
          type: array
          items:
            type: object
            properties:
              type: string
              id: string
              title: string
              description: string
      optional:
        sync_options:
          type: object
          properties:
            create_if_not_exists: boolean
            update_existing: boolean

  import_from_external:
    name: "Import from External Service"
    description: "Pull tasks/issues from external project management tools"
    category: integration
    icon: "download-cloud"
    contexts:
      - ideatree
      - taskboard
    handler: "integration.import_from_external_handler"
    cross_reference: null
    enabled: true
    requires_integration: true
    input_schema:
      required:
        integration_id:
          type: string
      optional:
        filters:
          type: object
          properties:
            status: array
            labels: array
            assignee: string
        limit:
          type: number
          default: 50

  execute_custom_api:
    name: "Execute Custom API"
    description: "Call a user-defined API endpoint"
    category: integration
    icon: "code"
    contexts:
      - ideatree
      - taskboard
    handler: "integration.execute_custom_api_handler"
    cross_reference: null
    enabled: true
    requires_integration: true
    input_schema:
      required:
        api_config_id:
          type: string
          description: "ID of the custom API configuration"
      optional:
        payload:
          type: object
          description: "Data to send to the API"
        override_params:
          type: object
          description: "Override default API parameters"

# ============================================================================
# TYPE DEFINITIONS
# ============================================================================
definitions:
  IdeaNode:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      description:
        type: string
      type:
        type: string
        enum: [idea, task, milestone, note]
      parent_id:
        type: string
        nullable: true

  Task:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      description:
        type: string
      status:
        type: string
        enum: [todo, in_progress, review, done]
      priority:
        type: number
        minimum: 1
        maximum: 5
      estimated_hours:
        type: number
      dependencies:
        type: array
        items: string
