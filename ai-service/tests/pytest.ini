[pytest]
# Pytest configuration for AI Agent tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use external services)
    api: API endpoint tests
    slow: Slow running tests
    requires_db: Tests that require database
    requires_api_key: Tests that require API keys

# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --color=yes

# Asyncio configuration
asyncio_mode = auto

# Coverage options (when running with --cov)
[coverage:run]
source = .
omit = 
    tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: