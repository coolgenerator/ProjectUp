name: Frontend CI/CD

on:
  push:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run tests (if available)
      run: npm run test --if-present
      continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Debug environment variables
      run: |
        echo "VITE_API_URL=${{ vars.VITE_API_URL }}"
        echo "VITE_WS_URL=${{ vars.VITE_WS_URL }}"
        echo "VITE_AI_SERVICE_URL=${{ vars.VITE_AI_SERVICE_URL }}"
        echo "VITE_AI_SERVICE_WS_URL=${{ vars.VITE_AI_SERVICE_WS_URL }}"
        echo "VITE_APP_NAME=${{ vars.VITE_APP_NAME }}"

    - name: Build application
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
        VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        VITE_AI_SERVICE_URL: ${{ vars.VITE_AI_SERVICE_URL }}
        VITE_AI_SERVICE_WS_URL: ${{ vars.VITE_AI_SERVICE_WS_URL }}
        VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    # Deploy to EC2 via SSH
    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        # Create deployment directory with correct ownership and permissions
        ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST "\
          sudo mkdir -p $DEPLOY_PATH && \
          sudo chown -R $USER:$USER $DEPLOY_PATH && \
          sudo chmod -R 755 $DEPLOY_PATH"

        # Sync files to EC2 (use --omit-dir-times to avoid permission errors)
        rsync -avz --delete --omit-dir-times \
          -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
          dist/ $USER@$HOST:$DEPLOY_PATH/

        # Set proper ownership for web server
        ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST "\
          sudo chown -R www-data:www-data $DEPLOY_PATH && \
          sudo chmod -R 755 $DEPLOY_PATH"

        # Restart web server
        ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST "\
          sudo systemctl reload nginx || sudo service nginx reload"

        rm -f private_key.pem

    # Option 3: Deploy to Vercel (uncomment if using Vercel)
    # - name: Deploy to Vercel
    #   uses: amondnet/vercel-action@v25
    #   with:
    #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
    #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
    #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
    #     vercel-args: '--prod'
    #     working-directory: ./

    # Option 4: Deploy to Netlify (uncomment if using Netlify)
    # - name: Deploy to Netlify
    #   uses: nwtgck/actions-netlify@v3.0
    #   with:
    #     publish-dir: './dist'
    #     production-branch: main
    #     github-token: ${{ secrets.GITHUB_TOKEN }}
    #     deploy-message: "Deploy from GitHub Actions"
    #   env:
    #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        uploadArtifacts: true
        temporaryPublicStorage: true
        configPath: './.lighthouserc.json'
